<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HistórIA — História e Logprobs</title>
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --surface: #fff;
      --surface-2: #f5f5f5;
      --surface-3: #ececec;
      --text: #202123;
      --muted: #737373;
      --border: #e5e5e5;
      --accent: #2563eb;
      --accent-contrast: #fff;
      --bubble: #f4f4f4;
      --shadow: 0 3px 18px rgba(0, 0, 0, .06);
      --heat-hover: #e8eefc;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #171717;
      --surface: #212121;
      --surface-2: #2b2b2b;
      --surface-3: #383838;
      --text: #ececec;
      --muted: #a3a3a3;
      --border: #3b3b3b;
      --accent: #3b82f6;
      --accent-contrast: #fff;
      --bubble: #2b2b2b;
      --shadow: 0 3px 18px rgba(0, 0, 0, .2);
      --heat-hover: #343f55;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      transition: background .18s, color .18s;
    }

    button,
    textarea,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 62px;
      flex: 0 0 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      letter-spacing: -.3px;
    }

    .brand-mark {
      height: 30px;
      width: 30px;
      border-radius: 9px;
      background: var(--text);
      color: var(--bg);
      display: grid;
      place-items: center;
      font-size: 17px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .model-label {
      font-size: 12px;
      color: var(--muted);
    }

    .theme-button,
    .icon-button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
    }

    .theme-button:hover,
    .icon-button:hover {
      background: var(--surface-2);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding-bottom: 180px;
    }

    #chat-inner {
      width: min(900px, calc(100% - 36px));
      margin: 0 auto;
      padding: 35px 0 40px;
    }

    #welcome {
      min-height: calc(100vh - 270px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 0 65px;
    }

    #welcome .welcome-mark {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--text);
      color: var(--bg);
      font-size: 25px;
      margin-bottom: 20px;
    }

    #welcome h1 {
      font-size: clamp(25px, 4vw, 34px);
      font-weight: 600;
      letter-spacing: -1px;
      margin: 0 0 10px;
    }

    #welcome p {
      color: var(--muted);
      font-size: 15px;
      margin: 0;
      line-height: 1.6;
    }

    #welcome .welcome-model {
      font-size: 12px;
      color: var(--muted);
      margin-top: 15px;
    }

    .message {
      margin: 0 0 34px;
    }

    .user-message {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 28px;
    }

    .user-bubble {
      max-width: min(78%, 680px);
      background: var(--bubble);
      border-radius: 22px;
      padding: 12px 17px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant-message {
      margin-bottom: 48px;
    }

    .assistant-header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
    }

    .assistant-avatar {
      width: 27px;
      height: 27px;
      border-radius: 8px;
      background: var(--text);
      color: var(--bg);
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .assistant-name {
      font-size: 14px;
      font-weight: 650;
    }

    .message-tools {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .tool-button {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
    }

    .tool-button:hover {
      background: var(--surface-2);
    }

    .answer {
      font-size: 16px;
      line-height: 1.85;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .answer-error {
      color: #b42318;
    }

    .token {
      border-radius: 3px;
      cursor: help;
      transition: outline .1s, background .1s;
      white-space: pre-wrap;
    }

    .token:hover,
    .token.token-active {
      outline: 1px solid rgba(80, 100, 140, .35);
      box-shadow: 0 0 0 2px var(--heat-hover);
    }

    .heat-legend {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 11px;
      flex-wrap: wrap;
    }

    .heat-legend[hidden] {
      display: none;
    }

    .response-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .response-layout.has-chart {
      grid-template-columns: minmax(260px, 1fr) 10px minmax(280px, .95fr);
      gap: 0;
    }

    .answer-column {
      min-width: 0;
      padding-right: 12px;
    }

    .resize-handle {
      width: 10px;
      align-self: stretch;
      min-height: 320px;
      cursor: col-resize;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      outline: none;
    }

    .resize-handle::after {
      content: "";
      display: block;
      width: 4px;
      height: 54px;
      border-radius: 99px;
      background: var(--border);
      transition: background .15s, transform .15s;
    }

    .resize-handle:hover::after,
    .resize-handle:focus-visible::after,
    .resize-handle.dragging::after {
      background: var(--accent);
      transform: scaleX(1.25);
    }

    .resize-handle[hidden] {
      display: none;
    }

    .chart-panel {
      min-width: 0;
      margin-top: 0;
      margin-left: 12px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .chart-panel[hidden] {
      display: none;
    }

    .heat-scale {
      width: 130px;
      height: 9px;
      border-radius: 99px;
      background: linear-gradient(
        to right,
        rgba(255, 236, 179, .35),
        rgba(255, 224, 130, .55),
        rgba(255, 183, 77, .68),
        rgba(255, 138, 52, .8),
        rgba(239, 83, 40, .88),
        rgba(198, 40, 40, .95)
      );
    }

    .chart-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .chart-heading h3 {
      font-size: 15px;
      margin: 0 0 5px;
    }

    .chart-heading p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0;
    }

    .metric-select {
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
    }

    
    .chart-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chart-panel:fullscreen {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      max-height: 100vh;
      overflow: auto;
      margin: 0;
      padding: 24px;
      border: 0;
      border-radius: 0;
      background: var(--bg);
      color: var(--text);
    }

    .chart-panel:fullscreen .chart {
      height: calc(100vh - 170px);
      min-height: 320px;
    }

    .chart-panel:fullscreen .token-detail {
      margin-top: 12px;
    }

    @media (max-width: 650px) {
      .chart-panel:fullscreen {
        padding: 14px;
      }

      .chart-panel:fullscreen .chart {
        height: calc(100vh - 210px);
        min-height: 260px;
      }
    }


    .chart {
      width: 100%;
      min-height: 280px;
    }

    .token-detail {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--surface-2);
      border-radius: 9px;
      padding: 11px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
    }

    .message-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 8px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes pulse {
      0%,
      80%,
      100% {
        opacity: .3;
        transform: translateY(0);
      }

      40% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    #input-area {
      position: fixed;
      z-index: 30;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 18px 20px;
      background: linear-gradient(
        to top,
        var(--bg) 78%,
        color-mix(in srgb, var(--bg) 0%, transparent)
      );
    }

    #composer {
      width: min(900px, 100%);
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 10px 12px 9px;
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    .attach-button {
      width: 37px;
      height: 37px;
      flex: 0 0 37px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 24px;
      display: grid;
      place-items: center;
    }

    .attach-button:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    #pergunta {
      flex: 1;
      min-width: 0;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      padding: 8px 3px;
      max-height: 170px;
    }

    #pergunta::placeholder {
      color: var(--muted);
    }

    .send-button {
      height: 38px;
      width: 38px;
      flex: 0 0 38px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 20px;
      display: grid;
      place-items: center;
    }

    .send-button:hover {
      filter: brightness(.95);
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 5px 0 48px;
    }

    .composer-hint {
      font-size: 11px;
      color: var(--muted);
      flex: 1;
    }

    .file-chip {
      display: none;
      align-items: center;
      gap: 8px;
      max-width: 55%;
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      overflow: hidden;
    }

    .file-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-file {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0 2px;
      font-size: 15px;
    }

    .status {
      width: min(900px, 100%);
      margin: 7px auto 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      min-height: 14px;
    }

    .error {
      color: #b42318;
    }

    #arquivo {
      display: none;
    }

    
  
    
    #token-tooltip {
      position: fixed;
      z-index: 1000;
      width: 230px;
      max-width: calc(100vw - 24px);
      max-height: min(360px, calc(100vh - 20px));
      overflow-y: auto;
      background: #171717;
      color: #f5f5f5;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 10px;
      line-height: 1.15;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .2);
      pointer-events: none;
      display: none;
      white-space: normal;
      scrollbar-width: thin;
      scrollbar-color: #777 #171717;
    }

    .tooltip-title {
      font-size: 11px;
      font-weight: 650;
      line-height: 1.2;
      margin-bottom: 5px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .tooltip-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
      border-top: 1px solid #333;
      line-height: 1.2;
    }

    .tooltip-line span {
      color: #aaa;
    }

    .tooltip-line strong {
      text-align: right;
      font-weight: 600;
    }

    .tooltip-alts {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid #444;
    }

    .tooltip-alt {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      padding: 1px 0;
      margin: 0;
      min-height: 0;
      line-height: 1.15;
    }

    .tooltip-alt .alt-token {
      flex: 1;
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #f5f5f5;
    }

    .tooltip-alt .alt-prob {
      flex-shrink: 0;
      align-self: flex-start;
      color: #bbb;
      white-space: nowrap;
      line-height: 1.15;
    }



    @media (max-width: 650px) {
      .response-layout.has-chart {
        grid-template-columns: minmax(0, 1fr) !important;
        gap: 20px;
      }

      .answer-column {
        padding-right: 0;
      }

      .resize-handle {
        display: none !important;
      }

      .chart-panel {
        margin-left: 0;
      }

      .topbar {
        height: 56px;
        flex-basis: 56px;
        padding: 0 14px;
      }

      .model-label {
        display: none;
      }

      #chat-inner {
        width: calc(100% - 28px);
        padding-top: 24px;
      }

      .user-bubble {
        max-width: 90%;
      }

      .answer {
        font-size: 15px;
        line-height: 1.8;
      }

      .message-tools {
        width: 100%;
        margin: 7px 0 0 36px;
      }

      .assistant-header {
        flex-wrap: wrap;
      }

      .chart-panel {
        padding: 13px;
      }

      .chart {
        min-height: 250px;
      }

      #input-area {
        padding: 10px 10px 13px;
      }

      .composer-hint {
        font-size: 10px;
      }

      .file-chip {
        max-width: 48%;
      }

      #welcome {
        min-height: calc(100vh - 230px);
      }
    }

    
    /* Painel lateral de frequência */
    
    /* Layout corrigido para o painel de frequências */
    .response-layout.has-frequency {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.95fr);
      gap: 20px;
      align-items: start;
    }

    .frequency-panel {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .frequency-panel[hidden] {
      display: none;
    }

    .frequency-panel .chart-heading {
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .frequency-panel .chart-heading h3 {
      overflow-wrap: anywhere;
    }

    .frequency-panel .chart-heading p {
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .frequency-total {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .frequency-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
      min-width: 0;
      max-height: 65vh;
      overflow-y: auto;
      margin-top: 18px;
    }

    .frequency-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(35px, 1.5fr) auto;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-width: 0;
      font-size: 12px;
    }

    .frequency-token {
      min-width: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .frequency-bar-track {
      min-width: 0;
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--surface-3);
    }

    .frequency-bar {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .frequency-count {
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .frequency-empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 650px) {
      .response-layout.has-frequency {
        grid-template-columns: minmax(0, 1fr) !important;
        gap: 20px;
      }

      .frequency-panel {
        margin: 0;
        padding: 13px;
      }

      .frequency-list {
        max-height: 45vh;
      }
    }


    .frequency-panel {
      min-width: 0;
      margin-left: 12px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .frequency-panel[hidden] {
      display: none;
    }

    .frequency-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 18px;
      max-height: 65vh;
      overflow-y: auto;
    }

    .frequency-item {
      display: grid;
      grid-template-columns: minmax(55px, .8fr) minmax(50px, 1.5fr) auto;
      align-items: center;
      gap: 9px;
      font-size: 12px;
    }

    .frequency-token {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .frequency-bar-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--surface-3);
    }

    .frequency-bar {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .frequency-count {
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .frequency-empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 650px) {
      .response-layout.has-frequency,
      .response-layout.has-chart {
        grid-template-columns: minmax(0, 1fr) !important;
        gap: 20px;
      }

      .frequency-panel {
        margin-left: 0;
        padding: 13px;
      }

      .frequency-list {
        max-height: 45vh;
      }
    }

  </style>
</head>

<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <span>HistórIA</span>
      </div>

      <div class="top-actions">
        <span class="model-label">Qwen 3.8 27B · Cloudflare Workers AI</span>
        <button
          class="theme-button"
          id="themeToggle"
          type="button"
          aria-label="Alternar tema"
        >
          ☾ Modo noturno
        </button>
      </div>
    </header>

    <main id="chat">
      <div id="chat-inner">
        <section id="welcome" aria-labelledby="welcome-title">
          <div class="welcome-mark" aria-hidden="true">✦</div>
          <h1 id="welcome-title">HistórIA</h1>
          <p>
            Qwen 3.8 27B · Cloudflare Workers AI.<br>
            Por onde começamos?
          </p>
          <div class="welcome-model">
            Faça uma pergunta e explore como a resposta é gerada.
          </div>
        </section>

        <div id="messages" aria-live="polite"></div>
      </div>
    </main>

    <div id="input-area">
      <div id="composer">
        <div class="composer-row">
          <button
            class="attach-button"
            id="attachButton"
            type="button"
            title="Anexar fonte histórica"
            aria-label="Anexar fonte histórica"
          >＋</button>

          <input
            id="arquivo"
            type="file"
            accept=".txt,.md,.csv"
            aria-label="Selecionar fonte histórica"
          >

          <textarea
            id="pergunta"
            rows="1"
            placeholder="Pergunte à HistórIA"
            aria-label="Sua pergunta"
          ></textarea>

          <button
            class="send-button"
            id="sendButton"
            type="button"
            title="Enviar pergunta"
            aria-label="Enviar pergunta"
          >↑</button>
        </div>

        <div class="composer-bottom">
          <span class="composer-hint">
            Enter para enviar · Shift + Enter para nova linha
          </span>

          <div class="file-chip" id="fileChip">
            <span id="fileName"></span>
            <button
              class="remove-file"
              id="removeFile"
              type="button"
              aria-label="Remover fonte"
            >×</button>
          </div>
        </div>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
  </div>

  <div id="token-tooltip" role="tooltip"></div>

  <script>
    const $ = (id) => document.getElementById(id);

    const perguntaInput = $("pergunta");
    const arquivoInput = $("arquivo");
    const messages = $("messages");
    const welcome = $("welcome");
    const chat = $("chat");
    const statusEl = $("status");
    const sendButton = $("sendButton");
    const tooltip = $("token-tooltip");

    let busy = false;
    let activeToken = null;

    function escaparHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatarProbabilidade(value) {
      if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
      ) {
        return "indisponível";
      }

      const probability = Number(value) * 100;

      if (probability >= 99.999999) return "≈ 100%";
      if (probability >= 1) return `${probability.toFixed(2)}%`;
      if (probability >= 0.01) return `${probability.toFixed(4)}%`;
      if (probability > 0) return `${probability.toExponential(2)}%`;

      return "0%";
    }

    function formatarLogprob(value) {
      if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
      ) {
        return "indisponível";
      }

      const logprob = Number(value);

      return Math.abs(logprob) < 0.0000005
        ? "≈ 0"
        : logprob.toFixed(6);
    }

    function corDoToken(probability) {
      if (
        probability === null ||
        probability === undefined ||
        !Number.isFinite(Number(probability))
      ) {
        return "transparent";
      }

      const value = Number(probability);

      if (value >= 0.90) return "rgba(255, 236, 179, .28)";
      if (value >= 0.70) return "rgba(255, 224, 130, .42)";
      if (value >= 0.50) return "rgba(255, 183, 77, .52)";
      if (value >= 0.25) return "rgba(255, 138, 52, .62)";
      if (value >= 0.10) return "rgba(239, 83, 40, .72)";

      return "rgba(198, 40, 40, .80)";
    }

    function ajustarTextarea() {
      perguntaInput.style.height = "auto";
      perguntaInput.style.height =
        `${Math.min(perguntaInput.scrollHeight, 170)}px`;
    }

    function scrollFinal() {
      requestAnimationFrame(() => {
        chat.scrollTo({
          top: chat.scrollHeight,
          behavior: "smooth"
        });
      });
    }

    function setStatus(text = "", isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function limparTooltip() {
      tooltip.style.display = "none";

      if (activeToken) {
        activeToken.classList.remove("token-active");
        activeToken = null;
      }
    }

    function mostrarTooltip(element, data) {
      activeToken = element;
      element.classList.add("token-active");

      const alternatives = Array.isArray(data.alternativas)
        ? data.alternativas
        : [];

      let html = `
        <div class="tooltip-title">
          Token: ${escaparHTML(JSON.stringify(data.token ?? ""))}
        </div>
        <div class="tooltip-line">
          <span>Probabilidade</span>
          <strong>${formatarProbabilidade(data.probabilidade)}</strong>
        </div>
        <div class="tooltip-line">
          <span>Logprob</span>
          <strong>${formatarLogprob(data.logprob)}</strong>
        </div>
      `;

      if (alternatives.length) {
        html += `
          <div class="tooltip-alts">
            <div style="color: #aaa; margin-bottom: 4px">
              Outras possibilidades
            </div>
        `;

        for (const alternative of alternatives) {
          html += `
            <div class="tooltip-alt">
              <span class="alt-token">
                ${escaparHTML(alternative.token || " ")}
              </span>
              <span class="alt-prob">
                ${formatarProbabilidade(alternative.probabilidade)}
              </span>
            </div>
          `;
        }

        html += "</div>";
      }

      tooltip.innerHTML = html;
      tooltip.style.display = "block";

      const rect = element.getBoundingClientRect();
      const tooltipRect = tooltip.getBoundingClientRect();
      const margin = 10;

      let left = rect.left + rect.width / 2 - tooltipRect.width / 2;
      left = Math.max(
        margin,
        Math.min(left, window.innerWidth - tooltipRect.width - margin)
      );

      let top = rect.top - tooltipRect.height - 9;

      if (top < margin) {
        top = Math.min(
          window.innerHeight - tooltipRect.height - margin,
          rect.bottom + 9
        );
      }

      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${Math.max(margin, top)}px`;
    }

    function renderizarResposta(element, texto, tokens, mostrarCalor = false) {
      element.replaceChildren();

      if (!mostrarCalor || !Array.isArray(tokens) || !tokens.length) {
        element.textContent = texto || "";
        return false;
      }

      const fragment = document.createDocumentFragment();

      for (const data of tokens) {
        const span = document.createElement("span");

        span.className = "token";
        span.textContent = data.token ?? "";
        span.style.backgroundColor = corDoToken(data.probabilidade);

        span.addEventListener("mouseenter", () => {
          mostrarTooltip(span, data);
        });

        span.addEventListener("mouseleave", () => {
          span.classList.remove("token-active");

          if (activeToken === span) {
            activeToken = null;
            tooltip.style.display = "none";
          }
        });

        fragment.appendChild(span);
      }

      element.appendChild(fragment);
      return true;
    }

    function criarGrafico(panel, data) {
      const graph = panel.querySelector(".chart");
      const detail = panel.querySelector(".token-detail");
      const select = panel.querySelector(".metric-select");

      if (typeof Plotly === "undefined") {
        detail.textContent = "A biblioteca do gráfico não foi carregada.";
        return;
      }

      const tokens = Array.isArray(data.tokens) ? data.tokens : [];

      if (!tokens.length) {
        graph.replaceChildren();
        detail.textContent = "Não há tokens disponíveis para visualizar.";
        return;
      }

      const metric = select.value;
      const values = tokens.map((token) => {
        if (metric === "logprob") {
          return token.logprob == null ? null : Number(token.logprob);
        }

        return token.probabilidade == null
          ? null
          : Number(token.probabilidade) * 100;
      });

      const custom = tokens.map((token, index) => ({
        indice: index,
        token: token.token,
        logprob: token.logprob,
        probabilidade: token.probabilidade,
        alternativas: token.alternativas || []
      }));

      const dark = document.documentElement.dataset.theme === "dark";

      const trace = {
        x: tokens.map((_, index) => index + 1),
        y: values,
        type: "scatter",
        mode: "lines+markers",
        customdata: custom,
        line: {
          color: dark ? "#93c5fd" : "#64748b",
          width: 2
        },
        marker: {
          size: 7,
          color: values.map((value) => {
            if (value == null) return "#9ca3af";

            if (metric === "logprob") {
              if (value > -0.5) return "#65a30d";
              if (value > -1.5) return "#d97706";
              return "#dc2626";
            }

            if (value >= 70) return "#65a30d";
            if (value >= 25) return "#d97706";

            return "#dc2626";
          })
        },
        hovertemplate:
          "<b>Token %{customdata.token}</b><br>" +
          "Posição: %{x}<br>" +
          "Probabilidade: %{customdata.probabilidade:.4%}<br>" +
          "Logprob: %{customdata.logprob:.6f}<extra></extra>"
      };

      const layout = {
        autosize: true,
        margin: { l: 55, r: 12, t: 12, b: 55 },
        paper_bgcolor: "rgba(0, 0, 0, 0)",
        plot_bgcolor: "rgba(0, 0, 0, 0)",
        xaxis: {
          title: "Posição do token",
          dtick: Math.max(1, Math.ceil(tokens.length / 12)),
          gridcolor: dark ? "#3b3b3b" : "#eee",
          color: dark ? "#ddd" : "#444"
        },
        yaxis: {
          title: metric === "probabilidade" ? "Probabilidade (%)" : "Logprob",
          gridcolor: dark ? "#3b3b3b" : "#eee",
          zeroline: true,
          color: dark ? "#ddd" : "#444"
        },
        font: {
          family: "Inter, system-ui, sans-serif",
          color: dark ? "#ddd" : "#444"
        }
      };

      Plotly.react(graph, [trace], layout, {
        responsive: true,
        displaylogo: false
      });

      graph.removeAllListeners?.("plotly_click");

      graph.on("plotly_click", (event) => {
        const point = event.points[0].customdata;
        const alternatives = point.alternativas.length
          ? point.alternativas
              .map((alternative) =>
                `${JSON.stringify(alternative.token)} — ` +
                `${formatarProbabilidade(alternative.probabilidade)} ` +
                `(logprob: ${formatarLogprob(alternative.logprob)})`
              )
              .join("\n")
          : "Nenhuma alternativa disponível.";

        detail.textContent =
          `Token: ${JSON.stringify(point.token)}\n` +
          `Posição: ${point.indice + 1}\n` +
          `Probabilidade: ${formatarProbabilidade(point.probabilidade)}\n` +
          `Logprob: ${formatarLogprob(point.logprob)}\n` +
          `Alternativas:\n${alternatives}`;
      });
    }

    function montarMensagemUsuario(pergunta) {
      const wrapper = document.createElement("div");
      const bubble = document.createElement("div");

      wrapper.className = "user-message";
      bubble.className = "user-bubble";
      bubble.textContent = pergunta;

      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);
    }

    
    function renderizarFrequencias(panel, data) {
      const list = panel.querySelector(".frequency-list");
      const totalElement = panel.querySelector(".frequency-total");

      const tokens = Array.isArray(data.tokens) ? data.tokens : [];
      const frequencias = new Map();

      for (const item of tokens) {
        const token = String(item.token ?? "");

        if (!token) continue;

        frequencias.set(token, (frequencias.get(token) || 0) + 1);
      }

      const ordenadas = [...frequencias.entries()]
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .slice(0, 100);

      const total = tokens.filter(item => String(item.token ?? "")).length;

      totalElement.textContent = `${total} tokens`;

      list.replaceChildren();

      if (!ordenadas.length) {
        const empty = document.createElement("p");
        empty.className = "frequency-empty";
        empty.textContent = "Não há tokens disponíveis para calcular as frequências.";
        list.appendChild(empty);
        return;
      }

      const maxCount = ordenadas[0][1];

      for (const [token, count] of ordenadas) {
        const row = document.createElement("div");
        row.className = "frequency-item";

        const tokenLabel = document.createElement("span");
        tokenLabel.className = "frequency-token";
        tokenLabel.textContent = JSON.stringify(token);

        const track = document.createElement("div");
        track.className = "frequency-bar-track";

        const bar = document.createElement("div");
        bar.className = "frequency-bar";
        bar.style.width = `${(count / maxCount) * 100}%`;
        track.appendChild(bar);

        const countLabel = document.createElement("span");
        countLabel.className = "frequency-count";
        countLabel.textContent = `${count}×`;

        row.append(tokenLabel, track, countLabel);
        list.appendChild(row);
      }
    }

    function montarMensagemAssistente() {
      const article = document.createElement("article");

      article.className = "message assistant-message";
      article.innerHTML = `
        <div class="assistant-header">
          <div class="assistant-avatar" aria-hidden="true">✦</div>
          <div class="assistant-name">HistórIA</div>

          <div class="message-tools">
            <button
              type="button"
              class="tool-button heat-toggle"
              aria-pressed="false"
              disabled
            >Mostrar mapa de calor</button>

            <button
              type="button"
              class="tool-button frequency-toggle"
              aria-expanded="false"
            >
              ▦ Frequência de tokens
            </button>

            <button
              type="button"
              class="tool-button chart-toggle"
              aria-expanded="false"
            >▥ Ver gráfico</button>

            <button type="button" class="tool-button copy-button">
              Copiar resposta
            </button>

            <button
              type="button"
              class="tool-button download-button"
              disabled
            >Baixar JSON</button>
          </div>
        </div>

        <div class="response-layout">
          <div class="answer-column">
            <div class="answer">
              <div class="typing" aria-label="Gerando resposta">
                <span></span><span></span><span></span>
              </div>
            </div>

            <div class="heat-legend" hidden>
              <span>Maior probabilidade</span>
              <div class="heat-scale"></div>
              <span>Menor probabilidade</span>
              <span style="margin-left: auto">
                Passe sobre um token para explorá-lo
              </span>
            </div>

            <div class="message-meta"></div>
          </div>

          <div
            class="resize-handle"
            hidden
            role="separator"
            aria-label="Redimensionar painel do gráfico"
            aria-orientation="vertical"
            aria-valuemin="260"
            aria-valuenow="50"
            aria-valuemax="80"
            tabindex="0"
            title="Arraste para redimensionar"
          ></div>

          
          <section class="chart-panel" hidden>
            <div class="chart-heading">
              <div>
                <h3>Probabilidade dos tokens</h3>
                <p>Selecione um ponto do gráfico para consultar o token e suas alternativas.</p>
              </div>

              <div class="chart-actions">
                <select class="metric-select" aria-label="Métrica do gráfico">
                  <option value="probabilidade">Probabilidade (%)</option>
                  <option value="logprob">Logprob</option>
                </select>

                <button
                  type="button"
                  class="tool-button fullscreen-button"
                  aria-label="Abrir gráfico em tela cheia">
                  ⛶ Tela cheia
                </button>
              </div>
            </div>

            <div class="chart" role="img"
                aria-label="Gráfico interativo das probabilidades dos tokens"></div>

            <div class="token-detail" aria-live="polite">
              Clique em um ponto do gráfico para ver os detalhes.
            </div>
          </section>

          <section class="frequency-panel" hidden>
            <div class="chart-heading">
              <div>
                <h3>Frequência de tokens</h3>
                <p>Tokens mais repetidos na resposta gerada.</p>
              </div>
              <span class="frequency-total"></span>
            </div>

            <div class="frequency-list"></div>
          </section>

        </div>
      `;

      messages.appendChild(article);

      const answer = article.querySelector(".answer");
      const chartPanel = article.querySelector(".chart-panel");
      const responseLayout = article.querySelector(".response-layout");
      const resizeHandle = article.querySelector(".resize-handle");
      const toggle = article.querySelector(".chart-toggle");
      const heatToggle = article.querySelector(".heat-toggle");
      const copy = article.querySelector(".copy-button");
      const download = article.querySelector(".download-button");
      const metric = article.querySelector(".metric-select");
      const heatLegend = article.querySelector(".heat-legend");
      const messageMeta = article.querySelector(".message-meta");

      
      const frequencyPanel = article.querySelector(".frequency-panel");
      const frequencyToggle = article.querySelector(".frequency-toggle");

      frequencyToggle.addEventListener("click", () => {
        const opening = frequencyPanel.hidden;

        frequencyPanel.hidden = !opening;
        responseLayout.classList.toggle("has-frequency", opening);

        frequencyToggle.setAttribute("aria-expanded", String(opening));
        frequencyToggle.textContent = opening
          ? "▦ Ocultar frequências"
          : "▦ Frequência de tokens";

        if (opening && responseData) {
          renderizarFrequencias(frequencyPanel, responseData);
        }
      });


      
      const fullscreenButton = article.querySelector('.fullscreen-button');

      fullscreenButton.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement === chartPanel) {
            await document.exitFullscreen();
          } else {
            await chartPanel.requestFullscreen();
          }
        } catch (error) {
          console.error('Erro ao abrir o gráfico em tela cheia:', error);
          setStatus('Não foi possível abrir o gráfico em tela cheia.', true);
        }
      });

      chartPanel.addEventListener('fullscreenchange', () => {
        const isFullscreen = document.fullscreenElement === chartPanel;

        fullscreenButton.textContent = isFullscreen
          ? '⛶ Sair da tela cheia'
          : '⛶ Tela cheia';

        fullscreenButton.setAttribute(
          'aria-label',
          isFullscreen ? 'Sair da tela cheia' : 'Abrir gráfico em tela cheia'
        );

        requestAnimationFrame(() => {
          const graph = chartPanel.querySelector('.chart');

          if (graph && graph.data && typeof Plotly !== 'undefined') {
            Plotly.Plots.resize(graph);
          }
        });
      });


      let responseData = null;
      let heatEnabled = false;
      let draggingPointerId = null;

      function resetSplit() {
        responseLayout.style.gridTemplateColumns = "";
        resizeHandle.classList.remove("dragging");
      }

      function resizePanels(clientX) {
        if (window.innerWidth <= 650) return;

        const rect = responseLayout.getBoundingClientRect();
        const handleWidth = 10;
        const minLeft = 260;
        const minRight = 280;
        const available = rect.width - handleWidth;

        let left = clientX - rect.left;
        left = Math.max(minLeft, Math.min(left, available - minRight));

        const right = available - left;

        responseLayout.style.gridTemplateColumns =
          `${left}px ${handleWidth}px ${right}px`;

        resizeHandle.setAttribute(
          "aria-valuenow",
          String(Math.round((left / available) * 100))
        );

        if (responseData) {
          requestAnimationFrame(() => {
            if (typeof Plotly !== "undefined") {
              const graph = chartPanel.querySelector(".chart");

              if (graph && graph.data) {
                Plotly.Plots.resize(graph);
              }
            }
          });
        }
      }

      resizeHandle.addEventListener("pointerdown", (event) => {
        if (chartPanel.hidden || window.innerWidth <= 650) return;

        event.preventDefault();
        draggingPointerId = event.pointerId;
        resizeHandle.classList.add("dragging");
        resizePanels(event.clientX);
      });

      window.addEventListener("pointermove", (event) => {
        if (draggingPointerId === event.pointerId) {
          resizePanels(event.clientX);
        }
      });

      function stopResize(event) {
        if (draggingPointerId === event.pointerId) {
          draggingPointerId = null;
          resizeHandle.classList.remove("dragging");
        }
      }

      window.addEventListener("pointerup", stopResize);
      window.addEventListener("pointercancel", stopResize);

      resizeHandle.addEventListener("keydown", (event) => {
        if (chartPanel.hidden || window.innerWidth <= 650) return;

        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();

          const current = resizeHandle.getBoundingClientRect().left;
          resizePanels(current + (event.key === "ArrowRight" ? 20 : -20));
        }
      });

      toggle.addEventListener("click", () => {
        const opening = chartPanel.hidden;

        chartPanel.hidden = !opening;
        resizeHandle.hidden = !opening;
        responseLayout.classList.toggle("has-chart", opening);

        if (!opening) resetSplit();

        toggle.textContent = opening ? "▤ Ocultar gráfico" : "▥ Ver gráfico";
        toggle.setAttribute("aria-expanded", String(opening));

        if (opening && responseData) {
          criarGrafico(chartPanel, responseData);
          setTimeout(() => {
            window.dispatchEvent(new Event("resize"));
          }, 30);
        }
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth <= 650) resetSplit();
      });

      heatToggle.addEventListener("click", () => {
        if (!responseData) return;

        heatEnabled = !heatEnabled;
        heatToggle.textContent = heatEnabled
          ? "Ocultar mapa de calor"
          : "Mostrar mapa de calor";

        heatToggle.setAttribute("aria-pressed", String(heatEnabled));
        heatLegend.hidden = !heatEnabled;

        renderizarResposta(
          answer,
          responseData.resposta,
          responseData.tokens || [],
          heatEnabled
        );
      });

      metric.addEventListener("change", () => {
        if (responseData) criarGrafico(chartPanel, responseData);
      });

      copy.addEventListener("click", async () => {
        const text = answer.innerText.trim();

        try {
          await navigator.clipboard.writeText(text);
          copy.textContent = "Copiado!";

          setTimeout(() => {
            copy.textContent = "Copiar resposta";
          }, 1800);
        } catch {
          setStatus("Não foi possível copiar o texto neste navegador.", true);
        }
      });

      download.addEventListener("click", () => {
        if (!responseData) return;

        const blob = new Blob(
          [JSON.stringify(responseData, null, 2)],
          { type: "application/json;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "historia-logprobs.json";

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);
      });

      return {
        article,

        setData(data) {
          responseData = data;
          article._responseData = data;

          if (!frequencyPanel.hidden) {
            renderizarFrequencias(frequencyPanel, data);
          }

          download.disabled = false;
          heatToggle.disabled = !(data.tokens && data.tokens.length);
          heatEnabled = false;

          heatToggle.textContent = "Mostrar mapa de calor";
          heatToggle.setAttribute("aria-pressed", "false");
          heatLegend.hidden = true;

          renderizarResposta(
            answer,
            data.resposta,
            data.tokens || [],
            false
          );

          const tokenCount = data.quantidade_tokens ?? (data.tokens || []).length;

          messageMeta.textContent =
            `${tokenCount} tokens analisados` +
            `${data.arquivo ? ` · Fonte: ${data.arquivo}` : ""}` +
            `${data.alinhamento_correto === false
              ? " · O alinhamento dos tokens não pôde ser confirmado."
              : ""}`;

          if (!data.tokens?.length) {
            heatToggle.disabled = true;
            messageMeta.textContent +=
              " · Mapa de calor indisponível para esta resposta.";
          }

          if (!chartPanel.hidden) {
            criarGrafico(chartPanel, data);
          }
        },

        setError(message) {
          answer.className = "answer answer-error";
          answer.textContent = message;
          heatLegend.style.display = "none";
          messageMeta.textContent = "A resposta não pôde ser gerada.";
        }
      };
    }


    async function perguntar() {
      const pergunta = perguntaInput.value.trim();

      if (!pergunta || busy) return;

      busy = true;
      sendButton.disabled = true;

      welcome.style.display = "none";
      setStatus("A HistórIA está gerando a resposta…");

      montarMensagemUsuario(pergunta);

      const assistant = montarMensagemAssistente();
      const arquivo = arquivoInput.files[0];

      perguntaInput.value = "";
      ajustarTextarea();
      scrollFinal();

      const formData = new FormData();

      formData.append("pergunta", pergunta);

      if (arquivo) {
        formData.append("arquivo", arquivo);
      }

      try {
        const response = await fetch("/api/perguntar", {
          method: "POST",
          body: formData
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("O servidor retornou uma resposta inválida.");
        }

        if (!response.ok) {
          throw new Error(data.erro || "Erro ao consultar a API.");
        }

        assistant.setData(data);

        setStatus(
          "Resposta gerada. Você pode ativar o mapa de calor ou abrir o gráfico ao lado da resposta."
        );
      } catch (error) {
        console.error(error);

        assistant.setError(
          error.message || "Não foi possível gerar a resposta."
        );

        setStatus("Não foi possível gerar a resposta.", true);
      } finally {
        busy = false;
        sendButton.disabled = false;
        perguntaInput.focus();
        scrollFinal();
      }
    }

    sendButton.addEventListener("click", perguntar);

    perguntaInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        perguntar();
      }
    });

    perguntaInput.addEventListener("input", ajustarTextarea);

    $("attachButton").addEventListener("click", () => {
      arquivoInput.click();
    });

    arquivoInput.addEventListener("change", () => {
      if (arquivoInput.files[0]) {
        $("fileName").textContent = `📄 ${arquivoInput.files[0].name}`;
        $("fileChip").style.display = "flex";
        setStatus("A fonte será enviada junto à próxima pergunta.");
      } else {
        $("fileChip").style.display = "none";
      }
    });

    $("removeFile").addEventListener("click", () => {
      arquivoInput.value = "";
      $("fileChip").style.display = "none";
      setStatus("Fonte removida.");
    });

    $("themeToggle").addEventListener("click", () => {
      const dark = document.documentElement.dataset.theme !== "dark";

      document.documentElement.dataset.theme = dark ? "dark" : "light";

      $("themeToggle").textContent = dark
        ? "☀ Modo claro"
        : "☾ Modo noturno";

      $("themeToggle").setAttribute(
        "aria-label",
        dark ? "Ativar tema claro" : "Ativar tema noturno"
      );

      document
        .querySelectorAll(".chart-panel:not([hidden])")
        .forEach((panel) => {
          const article = panel.closest(".assistant-message");
          const data = article?._responseData;

          if (data) criarGrafico(panel, data);
        });
    });

    window.addEventListener("scroll", limparTooltip, { passive: true });
    chat.addEventListener("scroll", limparTooltip, { passive: true });
    window.addEventListener("resize", limparTooltip);

    document.documentElement.dataset.theme = "light";
  </script>
</body>
</html>
