<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Visualização de Logprobs</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 40px;

            background: #f5f5f5;

            color: #222;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .container {

            max-width: 900px;

            margin: 0 auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.08);
        }


        h1 {

            margin-top: 0;

            font-size: 24px;
        }


        #informacoes {

            color: #666;

            font-size: 14px;

            margin-bottom: 25px;
        }


        #resposta {

            font-size: 18px;

            line-height: 1.8;

            white-space: pre-wrap;
        }


        .token {

            display: inline-block;

            cursor: pointer;

            border-radius: 4px;

            transition:
                background 0.1s ease;
        }


        .token:hover {

            background: #e5e7eb;
        }


        #tooltip {

            position: fixed;

            z-index: 9999;

            width: 300px;

            background: #1f1f1f;

            color: white;

            padding: 10px 12px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.4;

            box-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.25);

            pointer-events: none;

            display: none;
        }


        #tooltip .titulo {

            font-weight: bold;

            margin-bottom: 6px;
        }


        #tooltip .linha {

            margin-bottom: 3px;
        }


        #tooltip .alternativas {

            margin-top: 8px;

            border-top:
                1px solid
                rgba(255,255,255,0.2);

            padding-top: 7px;
        }


        #tooltip .alternativa {

            margin-top: 3px;

            color: #ddd;
        }


        #contador {

            margin-top: 25px;

            color: #777;

            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>
        Visualização de logprobs
    </h1>


    <div id="informacoes">
        Carregando...
    </div>


    <div id="resposta"></div>


    <div id="contador"></div>

</div>


<div id="tooltip"></div>


<script>


// ============================================================
// ELEMENTOS
// ============================================================

const respostaElemento =
    document.getElementById("resposta");

const informacoesElemento =
    document.getElementById("informacoes");

const contadorElemento =
    document.getElementById("contador");

const tooltip =
    document.getElementById("tooltip");


// ============================================================
// FORMATAÇÃO DE PROBABILIDADE
// ============================================================

function formatarProbabilidade(valor) {

    if (valor === null || valor === undefined) {
        return "—";
    }


    if (valor >= 0.99999999) {
        return "≈ 100%";
    }


    const porcentagem =
        valor * 100;


    if (porcentagem >= 1) {

        return porcentagem.toFixed(2) + "%";
    }


    if (porcentagem >= 0.01) {

        return porcentagem.toFixed(4) + "%";
    }


    if (porcentagem >= 0.000001) {

        return porcentagem.toFixed(8) + "%";
    }


    return porcentagem.toFixed(10) + "%";
}


// ============================================================
// FORMATAÇÃO DE LOGPROB
// ============================================================

function formatarLogprob(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return "—";
    }


    if (Math.abs(valor) < 0.0000005) {

        return "≈ 0";
    }


    return valor.toFixed(6);
}


// ============================================================
// ESCAPAR HTML
// ============================================================

function escaparHTML(texto) {

    return texto
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ============================================================
// MOSTRAR TOOLTIP
// ============================================================

function mostrarTooltip(elemento, dados) {

    let html = "";


    html +=
        '<div class="titulo">Token</div>';


    html +=
        '<div class="linha"><strong>' +
        escaparHTML(
            dados.token
        ) +
        '</strong></div>';


    html +=
        '<div class="linha">Probabilidade: ' +
        formatarProbabilidade(
            dados.probabilidade
        ) +
        '</div>';


    html +=
        '<div class="linha">Logprob: ' +
        formatarLogprob(
            dados.logprob
        ) +
        '</div>';


    if (
        dados.alternativas &&
        dados.alternativas.length > 0
    ) {

        html +=
            '<div class="alternativas">';

        html +=
            '<div><strong>Alternativas:</strong></div>';


        dados.alternativas.forEach(
            function(alternativa) {

                html +=
                    '<div class="alternativa">' +

                    escaparHTML(
                        alternativa.token
                    ) +

                    " — " +

                    formatarProbabilidade(
                        alternativa.probabilidade
                    ) +

                    "</div>";
            }
        );


        html +=
            "</div>";
    }


    tooltip.innerHTML = html;

    tooltip.style.display = "block";


    // --------------------------------------------------------
    // POSICIONAMENTO
    // --------------------------------------------------------

    const rect =
        elemento.getBoundingClientRect();


    const margem = 10;


    let esquerda =
        rect.left;


    let topo =
        rect.top -
        tooltip.offsetHeight -
        margem;


    // Se não houver espaço acima,
    // coloca abaixo.

    if (topo < margem) {

        topo =
            rect.bottom +
            margem;
    }


    // Impede que saia da tela pela direita.

    if (
        esquerda +
        tooltip.offsetWidth +
        margem
        >
        window.innerWidth
    ) {

        esquerda =
            window.innerWidth -
            tooltip.offsetWidth -
            margem;
    }


    // Impede que saia pela esquerda.

    if (esquerda < margem) {

        esquerda = margem;
    }


    tooltip.style.left =
        esquerda + "px";

    tooltip.style.top =
        topo + "px";
}


// ============================================================
// ESCONDER TOOLTIP
// ============================================================

function esconderTooltip() {

    tooltip.style.display =
        "none";
}


// ============================================================
// CRIAR TOKENS
// ============================================================

function criarResposta(dados) {

    respostaElemento.innerHTML = "";


    dados.tokens.forEach(
        function(token) {

            const span =
                document.createElement("span");


            span.className =
                "token";


            span.textContent =
                token.token;


            span._tokenData =
                token;


            span.addEventListener(
                "mouseenter",
                function() {

                    mostrarTooltip(
                        this,
                        this._tokenData
                    );
                }
            );


            span.addEventListener(
                "mouseleave",
                function() {

                    esconderTooltip();
                }
            );


            respostaElemento.appendChild(
                span
            );
        }
    );


    contadorElemento.textContent =
        dados.tokens.length +
        " tokens analisados";
}


// ============================================================
// CARREGAR JSON
// ============================================================

async function carregarDados() {

    try {

        const resposta =
            await fetch(
                "resultado_qwen32b.json"
            );


        if (!resposta.ok) {

            throw new Error(
                "Não foi possível carregar o JSON."
            );
        }


        const dados =
            await resposta.json();


        informacoesElemento.textContent =
            "Modelo: " +
            dados.modelo;


        criarResposta(dados);


    } catch (erro) {

        console.error(erro);


        informacoesElemento.textContent =
            "Erro ao carregar os dados.";


        respostaElemento.textContent =
            erro.message;
    }
}


// ============================================================
// INICIAR
// ============================================================

carregarDados();


</script>


</body>

</html>
